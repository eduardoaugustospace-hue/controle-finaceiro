<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle Financeiro</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#090a0e;--s1:#101218;--s2:#161922;--bd:#232733;--ink:#e8eaf0;--mut:#868c9c;--acc:#7c8cff;--in:#34d399;--out:#fb7185;--inb:#34d3991f;--outb:#fb71851f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 400px at 50% -120px,#1a1f3a,transparent),var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.w{max-width:1160px;margin:0 auto;padding:22px 16px 60px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px}
h1{font-size:18px;font-weight:600;margin:0;letter-spacing:-.3px}h2{font-size:14px;font-weight:600;margin:0 0 12px}
.bar,.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.row{flex-wrap:nowrap}
.card{background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--bd);border-radius:14px;padding:18px;box-shadow:inset 0 1px 0 #ffffff0a,0 12px 32px #0008}
button,input,select,textarea{font:inherit;color:var(--ink)}
input,select,textarea{background:#0c0e13;border:1px solid var(--bd);border-radius:8px;padding:8px 10px;width:100%;min-width:0;transition:border-color .15s,box-shadow .15s}
textarea{resize:vertical;min-height:38px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px #7c8cff33}
button{cursor:pointer;background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;transition:transform .12s,border-color .15s,background .15s;white-space:nowrap}
button:hover{border-color:#3a4052;background:#1c2029}button:active{transform:scale(.97)}button:disabled{opacity:.4;pointer-events:none}
.pri{background:var(--acc);border-color:var(--acc);color:#0b0d1a;font-weight:600}.pri:hover{background:#97a4ff}
.bar select,.bar input{width:auto}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:12px}
.st small{color:var(--mut)}.st b{display:block;font-size:26px;font-weight:600;letter-spacing:-.8px;font-variant-numeric:tabular-nums}
.in{color:var(--in)}.out{color:var(--out)}.hint{font-size:12px;color:var(--mut)}
.pb{height:5px;background:var(--bd);border-radius:9px;margin-top:8px;overflow:hidden}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--out));width:0;transition:width .4s}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.ch{position:relative;height:260px}canvas{cursor:pointer}
.m{display:grid;grid-template-columns:320px 1fr;gap:12px;align-items:start}
form{display:grid;gap:10px}label{display:grid;gap:4px;color:var(--mut);font-size:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#0c0e13;border:1px solid var(--bd);border-radius:9px;padding:3px;gap:3px}
.seg input{position:absolute;opacity:0;width:0}.seg label{padding:7px;text-align:center;cursor:pointer;border-radius:6px;color:var(--ink);transition:background .15s}
#ti:checked+label{background:var(--inb);color:var(--in)}#to:checked+label{background:var(--outb);color:var(--out)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;color:var(--mut);font-weight:500;font-size:12px;padding:8px;border-bottom:1px solid var(--bd)}
td{padding:9px 8px;border-bottom:1px solid #1a1e28;vertical-align:middle}tr:hover td{background:#ffffff05}
.v{text-align:right;font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.tag{font-size:11px;padding:2px 8px;border-radius:20px}.tag.in{background:var(--inb)}.tag.out{background:var(--outb)}
td select{padding:4px 6px;font-size:13px;width:auto;max-width:140px}.nt{color:var(--mut);font-size:12px}
.empty{text-align:center;color:var(--mut);padding:26px}
dialog{border:1px solid var(--bd);border-radius:16px;background:var(--s1);color:var(--ink);width:min(760px,94vw);padding:20px;box-shadow:0 30px 80px #000c;animation:pop .18s ease-out}
dialog::backdrop{background:#000a;backdrop-filter:blur(3px)}@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.mh h2{margin:0;font-size:16px}
.rr{display:grid;grid-template-columns:auto 1fr 90px 130px 70px auto auto auto;gap:6px;align-items:center;margin-bottom:8px}
#toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,20px);background:var(--s2);border:1px solid var(--bd);padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px #000a}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:880px){.g,.m{grid-template-columns:1fr}.rr{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
[hidden]{display:none!important}
.tabs{display:flex;gap:6px;margin-bottom:12px}.ck{display:flex;align-items:center;gap:8px}.ck input{width:auto}
.rr2{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;margin-bottom:8px}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.mg button{display:grid;padding:10px 6px}.mg small{opacity:.7;font-size:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal button{padding:8px 0}.cal small{color:var(--mut)}.cal .rg{background:#7c8cff2e;border-color:transparent}
tr.fc td{opacity:.68}tr.fc td:first-child{box-shadow:inset 2px 0 0 var(--acc)}tr.fc{background:repeating-linear-gradient(135deg,transparent 0 6px,#7c8cff0d 6px 12px)}
.tag.fcg{border:1px dashed var(--acc);color:var(--acc);background:none}
#auth{min-height:100vh;display:grid;place-items:center;padding:16px}
#auth form{width:min(390px,100%);display:grid;gap:12px;padding:30px;animation:pop .25s ease-out}
#auth h1{font-size:22px}#amsg{min-height:20px;font-size:13px}
</style>
</head>
<body>
<div id="auth"><form id="af" class="card">
  <div><h1>Controle Financeiro</h1><p class="hint" style="margin:4px 0 0">Entre ou crie sua conta para acessar seus dados.</p></div>
  <label>E-mail<input id="ae" type="email" autocomplete="username" required></label>
  <label>Senha<input id="ap" type="password" autocomplete="current-password" minlength="6" required></label>
  <div id="amsg" role="alert"></div>
  <button class="pri" id="ain">Entrar</button><button type="button" id="aup">Criar conta</button>
</form></div>
<div class="w" id="app" hidden>
<header><h1>Controle Financeiro</h1><div class="bar">
<button id="pv" aria-label="Anterior">‹</button><button id="pp" style="min-width:220px" aria-label="Escolher período"></button><button id="nx" aria-label="Próximo">›</button>
<button id="bc">Ciclo</button><button id="br">Recorrências</button><button id="bi">Importar extrato</button><input type="file" id="fi" accept=".csv,.ofx,.txt" hidden><button id="lo" aria-label="Sair" style="background:none;border-color:transparent;color:var(--mut)">Sair</button></div></header>

<div class="st"><div class="card"><small>Receitas realizadas</small><b class="in" id="si"></b><span class="hint" id="sip"></span></div>
<div class="card"><small>Despesas realizadas</small><b class="out" id="so"></b><span class="hint" id="sop"></span></div>
<div class="card"><small>Saldo realizado</small><b id="sb"></b><div class="pb"><i id="sp"></i></div><span class="hint" id="sh"></span></div></div>
<div class="g"><div class="card"><h2>Receitas × Despesas <span class="hint">· tracejado = previsão</span></h2><div class="ch"><canvas id="c1"></canvas></div></div>
<div class="card"><div class="bar" style="justify-content:space-between;margin-bottom:12px"><h2 id="h2" style="margin:0"></h2><div class="tabs" id="cmt" style="margin:0"><button data-cm="expense">Despesas</button><button data-cm="income">Receitas</button></div></div><div class="ch"><canvas id="c2"></canvas></div></div></div>
<div class="m">
  <div class="card"><h2 id="ft">Nova transação</h2>
  <form id="form">
    <div class="seg"><input type="radio" name="t" id="to" value="expense" checked><label for="to">Despesa</label><input type="radio" name="t" id="ti" value="income"><label for="ti">Receita</label></div>
    <label>Descrição<input id="ds" required maxlength="80"></label>
    <div class="row"><label style="flex:1">Valor (R$)<input id="am" inputmode="numeric" placeholder="0,00" autocomplete="off" required></label><label style="flex:1">Data<input id="dt" type="date" required></label></div>
    <label>Categoria<div class="row"><select id="ct"></select><button type="button" id="cm">Gerenciar</button></div></label>
    <label>Observação<textarea id="nt" maxlength="300" placeholder="Opcional"></textarea></label>
    <label class="ck"><input type="checkbox" id="fcb"> Estimativa (previsão, ainda não confirmada)</label><div id="rp" class="row"><label style="flex:1">Repetir<select id="rep"><option value="">Não repetir</option><option value="m">Todo mês, no mesmo dia</option></select></label><label id="nl" hidden style="width:110px">Vezes (0 = ∞)<input id="nr" type="number" min="0" value="12"></label></div>
    <label>Forçar ciclo (opcional)<input id="ov" type="month"></label>
    <div class="row"><button class="pri" style="flex:1" id="sv">Adicionar</button><button type="button" id="cn" hidden>Cancelar</button></div>
  </form></div>
  <div class="card">
    <div class="bar" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">Transações</h2>
    <select id="fl" style="width:auto"><option value="all">Todas</option><option value="income">Receitas</option><option value="expense">Despesas</option></select></div>
    <div id="bb" class="bar" hidden style="margin-bottom:10px"><span id="bn" class="hint"></span><select id="bk" style="width:auto"></select><button id="bx">Excluir selecionadas</button></div>
    <div class="tw"><table style="min-width:840px"><thead><tr><th><input type="checkbox" id="ma" aria-label="Marcar todos"></th><th>Data</th><th>Descrição</th><th>Categoria</th><th>Tipo</th><th class="v">Valor</th><th class="v">Saldo acum.</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
  </div>
</div>
</div>

<dialog id="md"><div class="mh"><h2 id="mt"></h2><button onclick="md.close()" aria-label="Fechar">✕</button></div><div id="mb"></div></dialog>
<div id="toast" role="status"></div>

<script>
// ===== CONFIGURAÇÃO DO SUPABASE (Project Settings → API) =====
// Use SOMENTE a anon key (pública por desenho; a RLS protege os dados). Nunca a service_role.
const SUPABASE_URL='https://sxoqhmnagsoqdrnbjbbb.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4b3FobW5hZ3NvcWRybmJqYmJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyMjU0MzMsImV4cCI6MjEwODgwMTQzM30.mAGG1xYNMm7CUgcYAXa83GLsLkgnDELA_3dcs6stBs0';
const $=s=>document.querySelector(s),K='fin.v2',md=$('#md');
const MES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const DEF={tx:[],rules:[],del:{tx:[],rules:[]},cats:{income:['Salário','Adiantamento','Extras'],expense:['Alimentação','Moradia','Transporte','Lazer','Saúde','Outros']},cfg:{start:20,end:1,gap:'prev'}};
let S=load(),sel,from,to,fl='all',editId=null,sb=null,IMP=[],tm;
function load(){try{const r=JSON.parse(localStorage.getItem(K)||localStorage.getItem('fin.v1'));const s=r?{...structuredClone(DEF),...r}:structuredClone(DEF);s.tx.forEach(t=>{t.id=String(t.id);t.note??=''});return s}catch{return structuredClone(DEF)}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch{}clearTimeout(tm);tm=setTimeout(push,700)}
const brl=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),pad=n=>String(n).padStart(2,'0'),key=(y,m)=>y+'-'+pad(m);
const addM=(k,n)=>{const[y,m]=k.split('-').map(Number),t=y*12+m-1+n;return key(Math.floor(t/12),t%12+1)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('sv-SE'),fd=d=>d.split('-').reverse().join('/'),uid=()=>crypto.randomUUID();
let TD=today();const isFc=t=>!!t.fc||t.date>TD;
const shortL=k=>MES[k.split('-')[1]-1]+'/'+k.slice(2,4);
const longL=k=>{const[y,m]=k.split('-').map(Number),n=+addM(k,1).split('-')[1],{start,end}=S.cfg;return `${MES[m-1]}/${y} (${pad(start)}/${pad(m)} – ${pad(end)}/${pad(n)})`};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2800)};
function cycleOf(t){
  if(t.cycle)return t.cycle;
  const[y,m,d]=t.date.split('-').map(Number),k=key(y,m),{start,end,gap}=S.cfg;
  return d>=start?k:d<=end?addM(k,-1):gap==='next'?k:addM(k,-1);
}
const inP=t=>sel==='all'||(sel==='free'?(!from||t.date>=from)&&(!to||t.date<=to):cycleOf(t)===sel);
const sum=(a,t)=>a.filter(x=>x.type===t).reduce((s,x)=>s+x.amount,0);
const opts=(ty,s)=>S.cats[ty].concat(!s||S.cats[ty].includes(s)?[]:[s]).map(c=>`<option${c===s?' selected':''}>${esc(c)}</option>`).join('');
const tag=t=>`<span class="tag ${t==='income'?'in':'out'}">${t==='income'?'Receita':'Despesa'}</span>`;

// ---------- Recorrências ----------
function occ(r,i){const[y,m]=r.start.split('-').map(Number),k=addM(key(y,m),i),[Y,M]=k.split('-').map(Number);return `${k}-${pad(Math.min(r.day,new Date(Y,M,0).getDate()))}`}
function gen(){
  const lk=addM(today().slice(0,7),12),ids=new Set(S.tx.map(t=>t.id));
  S.rules.forEach(r=>{for(let i=0;i<(r.n>0?r.n:600);i++){
    const d=occ(r,i);if(!(r.n>0)&&d.slice(0,7)>lk)break;
    const id=r.id+'_'+i;if(r.skip.includes(i)||ids.has(id))continue;
    S.tx.push({id,type:r.type,desc:r.desc,amount:r.amount,date:d,cat:r.cat,note:r.note,rule:r.id,idx:i})}});
}

// ---------- Gráficos ----------
Chart.defaults.color='#868c9c';Chart.defaults.borderColor='#232733';Chart.defaults.font.family='Inter,system-ui,sans-serif';Chart.defaults.maintainAspectRatio=false;
let keys=[],cm='expense';
const DS=(l,c,st,f)=>({label:l,data:[],stack:st,backgroundColor:f?c+'33':c,borderColor:c,borderWidth:f?1.5:0,borderDash:f?[5,4]:[],borderRadius:6});
const c1=new Chart($('#c1'),{type:'bar',data:{labels:[],datasets:[DS('Receitas','#34d399','r'),DS('Receitas previstas','#34d399','r',1),DS('Despesas','#fb7185','d'),DS('Despesas previstas','#fb7185','d',1)]},
  options:{onClick:(e,el)=>{if(!el.length)return;const{datasetIndex:d,index:i}=el[0],t=d<2?'income':'expense',f=d%2===1,k=keys[i];
    detail(`${t==='income'?'Receitas':'Despesas'}${f?' previstas':''} · ${shortL(k)}`,(sel==='free'?S.tx.filter(inP):S.tx).filter(x=>x.type===t&&isFc(x)===f&&cycleOf(x)===k))},
    plugins:{tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${brl(c.parsed.y)}`}}},scales:{x:{stacked:true},y:{stacked:true,beginAtZero:true,ticks:{callback:v=>'R$ '+v}}}}});
const PAL=['#7c8cff','#34d399','#fbbf24','#fb7185','#38bdf8','#c084fc','#fb923c','#94a3b8'];
const c2=new Chart($('#c2'),{type:'doughnut',data:{labels:[],datasets:[{label:'Realizado',data:[],backgroundColor:PAL,borderColor:'#101218',borderWidth:2},{label:'Previsão',data:[],backgroundColor:PAL.map(c=>c+'40'),borderColor:PAL,borderWidth:1.5,borderDash:[4,3]}]},
  options:{cutout:'45%',onClick:(e,el)=>{if(!el.length)return;const c=c2.data.labels[el[0].index],f=el[0].datasetIndex===1;
    detail(`${cm==='income'?'Receitas':'Despesas'}${f?' previstas':''} · ${c}`,S.tx.filter(t=>inP(t)&&t.type===cm&&t.cat===c&&isFc(t)===f))},
    plugins:{legend:{position:'right'},tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${c.label} · ${brl(c.parsed)}`}}}}});

// ---------- Modal ----------
function modal(t,h){$('#mt').textContent=t;$('#mb').innerHTML=h;if(!md.open)md.showModal()}
function detail(title,l){
  l=[...l].sort((a,b)=>b.date.localeCompare(a.date));
  const tot=l.reduce((s,t)=>s+(t.type==='income'?t.amount:-t.amount),0);
  modal(title,`<div class="tw"><table><thead><tr><th>Data</th><th>Descrição</th><th>Classificação</th><th>Tipo</th><th class="v">Valor</th><th>Observação</th></tr></thead><tbody>${
    l.map(t=>`<tr><td>${fd(t.date)}</td><td>${esc(t.desc)}${isFc(t)?' <span class="tag fcg">Previsão</span>':''}</td><td>${esc(t.cat)}</td><td>${tag(t.type)}</td><td class="v ${t.type==='income'?'in':'out'}">${brl(t.amount)}</td><td class="nt">${esc(t.note)||'—'}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Nada aqui.</td></tr>'
  }</tbody></table></div><p class="hint">${l.length} lançamento(s) · saldo ${brl(tot)}</p>`);
}

// ---------- Render ----------
function render(){
  TD=today();
  $('#pp').textContent=sel==='all'?'Histórico completo':sel==='free'?`${fd(from)} – ${fd(to)}`:longL(sel);
  $('#pv').disabled=$('#nx').disabled=['all','free'].includes(sel);
  const base=S.tx.filter(inP),R=base.filter(t=>!isFc(t)),F=base.filter(isFc);
  const inc=sum(R,'income'),exp=sum(R,'expense'),bal=inc-exp,pi=sum(F,'income'),pe=sum(F,'expense');
  $('#si').textContent=brl(inc);$('#so').textContent=brl(exp);$('#sb').textContent=brl(bal);$('#sb').className=bal<0?'out':'in';
  $('#sip').textContent=pi?'+ '+brl(pi)+' previstos':'';$('#sop').textContent=pe?'+ '+brl(pe)+' previstos':'';
  const p=inc>0?exp/inc*100:exp>0?100:0;$('#sp').style.width=Math.min(p,100)+'%';
  $('#sh').textContent=(inc>0?p.toFixed(0)+'% gasto':'Sem receitas realizadas')+(pi||pe?' · projetado '+brl(bal+pi-pe):'');

  let a=sel==='all'?cycleOf({date:TD}):sel==='free'?cycleOf({date:to||TD}):sel,n=6;
  if(sel==='free'&&from){const[y1,m1]=cycleOf({date:from}).split('-').map(Number),[y2,m2]=a.split('-').map(Number);n=Math.min(12,Math.max(1,(y2*12+m2)-(y1*12+m1)+1))}
  keys=Array.from({length:n},(_,i)=>addM(a,i-n+1));
  const src=sel==='free'?base:S.tx;c1.data.labels=keys.map(shortL);
  c1.data.datasets.forEach((d,i)=>d.data=keys.map(k=>sum(src.filter(x=>cycleOf(x)===k&&isFc(x)===(i%2===1)),i<2?'income':'expense')));c1.update();
  const m=f=>{const o={};base.filter(t=>t.type===cm&&isFc(t)===f).forEach(t=>o[t.cat]=(o[t.cat]||0)+t.amount);return o},a1=m(false),a2=m(true),lb=[...new Set([...Object.keys(a1),...Object.keys(a2)])];
  c2.data.labels=lb;c2.data.datasets[0].data=lb.map(l=>a1[l]||0);c2.data.datasets[1].data=lb.map(l=>a2[l]||0);c2.update();
  $('#h2').textContent=(cm==='income'?'Receitas':'Despesas')+' por categoria';
  document.querySelectorAll('#cmt button').forEach(b=>b.classList.toggle('pri',b.dataset.cm===cm));

  const bm={};let acc=0;[...S.tx].sort((x,y)=>x.date.localeCompare(y.date)||x.id.localeCompare(y.id)).forEach(t=>{acc=Math.round((acc+(t.type==='income'?t.amount:-t.amount))*100)/100;bm[t.id]=acc});
  const rows=base.filter(t=>fl==='all'||t.type===fl).sort((x,y)=>y.date.localeCompare(x.date)||y.id.localeCompare(x.id));
  $('#rows').innerHTML=rows.map(t=>{const f=isFc(t),i=t.type==='income';return `<tr class="${f?'fc':''}"><td><input type="checkbox" data-s="${t.id}" ${SEL.has(t.id)?'checked':''} aria-label="Selecionar"></td><td>${fd(t.date)}</td>
    <td>${esc(t.desc)}${t.rule?' <span class="hint" title="Recorrente">↻</span>':''}${f?' <span class="tag fcg">Previsão</span>':''}${t.note?`<div class="nt">${esc(t.note)}</div>`:''}</td>
    <td><select data-c="${t.id}" aria-label="Categoria">${opts(t.type,t.cat)}</select></td><td>${tag(t.type)}</td>
    <td class="v ${i?'in':'out'}">${i?'+':'−'} ${brl(t.amount)}</td><td class="v ${bm[t.id]<0?'out':''}">${f?'~ ':''}${brl(bm[t.id])}</td>

function parseOFX(s){return[...s.matchAll(/<STMTTRN>([\s\S]*?)(?=<\/STMTTRN>|<STMTTRN>|<\/BANKTRANLIST>|$)/gi)].map(m=>{const g=t=>(m[1].match(new RegExp('<'+t+'>([^<\\r\\n]*)','i'))||[])[1]?.trim(),d=g('DTPOSTED')||'';
  return{date:`${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}`,amount:num(g('TRNAMT')),desc:g('MEMO')||g('NAME')||'Lançamento'}})}
function parseCSV(s){
  const L=s.split(/\r?\n/).filter(x=>x.trim()),dl=(L[0].match(/;/g)||[]).length>=(L[0].match(/,/g)||[]).length?';':',';

  if(di<0||vi<0)throw Error('CSV precisa ter colunas de data e valor no cabeçalho');
  return L.slice(1).map(l=>{const c=sp(l);return{date:pd(c[di]),amount:num(c[vi]),desc:c[ni]||'Lançamento'}});
}

async function uidSb(){return(await sb.auth.getUser()).data.user.id}
async function push(){
  if(!sb)return;
  try{const u=await uidSb(),T=sb.from('transactions'),R=sb.from('recurrences');
    const tx=S.tx.map(t=>({id:t.id,user_id:u,type:t.type,description:t.desc,amount:t.amount,date:t.date,category:t.cat,note:t.note||'',rule_id:t.rule||null,rule_idx:t.idx??null,overridden:!!t.ov,forecast:!!t.fc}));
    const ru=S.rules.map(r=>({id:r.id,user_id:u,type:r.type,description:r.desc,amount:r.amount,category:r.cat,note:r.note||'',day:r.day,start_date:r.start,repeats:r.n,skip:r.skip}));
    const ca=['income','expense'].flatMap(t=>S.cats[t].map(name=>({user_id:u,type:t,name})));
    const run=async p=>{const{error}=await p;if(error)throw error};
    if(S.del.tx.length)await run(T.delete().in('id',S.del.tx));if(S.del.rules.length)await run(R.delete().in('id',S.del.rules));
    if(ru.length)await run(R.upsert(ru));
    for(let i=0;i<tx.length;i+=500)await run(T.upsert(tx.slice(i,i+500)));
    await run(sb.from('categories').delete().eq('user_id',u));if(ca.length)await run(sb.from('categories').insert(ca));
    S.del={tx:[],rules:[]};localStorage.setItem(K,JSON.stringify(S));return true}
  catch(e){toast('Falha ao sincronizar: '+(e.message||e));return false}
}

  if(t.error||r.error||c.error)throw(t.error||r.error||c.error);
  if(!t.data.length&&!r.data.length&&S.tx.length){await push();return toast('Dados locais enviados para a nuvem')}
  S.tx=t.data.map(x=>({id:x.id,type:x.type,desc:x.description,amount:+x.amount,date:x.date,cat:x.category,note:x.note,rule:x.rule_id,idx:x.rule_idx,ov:x.overridden,fc:x.forecast}));
  S.rules=r.data.map(x=>({id:x.id,type:x.type,desc:x.description,amount:+x.amount,cat:x.category,note:x.note,day:x.day,start:x.start_date,n:x.repeats,skip:x.skip||[]}));
  if(c.data.length)['income','expense'].forEach(k=>S.cats[k]=c.data.filter(x=>x.type===k).map(x=>x.name));
  gen();localStorage.setItem(K,JSON.stringify(S));render();toast('Dados carregados da nuvem')
}

  const r=mode==='in'?await cli.auth.signInWithPassword({email,password}):await cli.auth.signUp({email,password});
  $('#ain').disabled=$('#aup').disabled=false;
  if(r.error)return amsg(ERR[r.error.message]||r.error.message);
  if(mode==='up'&&!r.data.session)amsg('Conta criada! Confirme o e-mail e depois clique em “Entrar”.',true);
}
$('#af').onsubmit=e=>{e.preventDefault();auth('in')};$('#aup').onclick=()=>auth('up');
async function enter(ses){
  started=true;sb=cli;$('#lo').title='Sair ('+ses.user.email+')';gate(true);
  try{await pull()}catch(e){toast('Erro ao carregar dados: '+(e.message||e))}
  render();c1.resize();c2.resize();
}
function out(){ // limpa dados da sessão deste aparelho; só a preferência de ciclo permanece
  started=false;sb=null;clearTimeout(tm);SEL.clear();if(md.open)md.close();
  const cfg=S.cfg;S=structuredClone(DEF);S.cfg=cfg;
  try{localStorage.setItem(K,JSON.stringify({cfg}));localStorage.removeItem('fin.v1')}catch{}
  $('#ap').value='';amsg('');render();gate(false);
}
$('#lo').onclick=async()=>{clearTimeout(tm);
  if(await push()===false)return ask('Sair mesmo assim?','Algumas alterações não foram sincronizadas e serão perdidas ao sair.',()=>cli.auth.signOut());
  cli.auth.signOut()};
if(!cli)amsg('Configure SUPABASE_URL e SUPABASE_ANON_KEY no topo do script.');
else cli.auth.onAuthStateChange((ev,ses)=>{ // dispara também ao recarregar a página, restaurando a sessão salva
  if(ses&&!started)setTimeout(()=>enter(ses),0);
  if(!ses&&started)out()});
</script>
</body>
</html>
